name: Speedtest

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Download release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "cf-speedtest_*_linux_amd64.tar.gz" \
            --dir /tmp
          archive=$(ls /tmp/cf-speedtest_*_linux_amd64.tar.gz)
          tar -xzf "$archive" -C /tmp
          chmod +x /tmp/cf-speedtest

      - name: Run speedtest
        run: /tmp/cf-speedtest
