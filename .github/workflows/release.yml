name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish with GoReleaser (skips Release Please)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release

  goreleaser:
    name: GoReleaser
    needs: release-please
    if: |
      always() &&
      !cancelled() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.tag != '') ||
        (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24.x"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Invoked directly because release:published from GITHUB_TOKEN does not
  # start other workflows (see docs.github.com GITHUB_TOKEN triggering).
  smoke:
    name: Smoke
    needs: [release-please, goreleaser]
    if: |
      always() &&
      !cancelled() &&
      needs.goreleaser.result == 'success'
    uses: ./.github/workflows/smoke.yml
    with:
      tag: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
