name: Smoke

on:
  # Human-published releases (UI/API with a PAT). Releases published by
  # GITHUB_TOKEN in the Release workflow do not trigger this event.
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to smoke-test
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to smoke-test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Download release binary
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          asset_url=$(curl -fsSL --proto '=https' --proto-redir '=https' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" \
            | jq -r '.assets[] | select(.name | test("^cfspeed_.*_linux_amd64\\.tar\\.gz$")) | .url')
          curl -fsSL --proto '=https' --proto-redir '=https' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/cfspeed_linux_amd64.tar.gz \
            "$asset_url"
          tar -xzf /tmp/cfspeed_linux_amd64.tar.gz -C /tmp
          chmod +x /tmp/cfspeed

      - name: Run speedtest
        run: /tmp/cfspeed
