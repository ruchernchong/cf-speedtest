name: Smoke

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Download release binary
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          asset_url=$(curl -fsSL --proto '=https' --proto-redir '=https' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" \
            | jq -r '.assets[] | select(.name | test("^cf-speedtest_.*_linux_amd64\\.tar\\.gz$")) | .url')
          curl -fsSL --proto '=https' --proto-redir '=https' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/cf-speedtest_linux_amd64.tar.gz \
            "$asset_url"
          tar -xzf /tmp/cf-speedtest_linux_amd64.tar.gz -C /tmp
          chmod +x /tmp/cf-speedtest

      - name: Run speedtest
        run: /tmp/cf-speedtest
