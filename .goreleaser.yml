version: 2

project_name: cf-speedtest

before:
  hooks:
    # Keep go.sum committed; do not run `go mod tidy` here — it can dirty
    # the tree after tag and fail GoReleaser's clean working-tree check.
    - go test ./...

builds:
  - id: cf-speedtest
    main: ./cmd/cf-speedtest
    binary: cf-speedtest
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: ruchernchong
    name: cf-speedtest
  # Release Please creates a draft (mutable) release; adopt it, upload
  # binaries, then publish. Published GitHub releases are immutable, so
  # assets cannot be attached afterward.
  use_existing_draft: true
  mode: keep-existing
